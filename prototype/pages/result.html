<!DOCTYPE html>
<!--
  文件：prototype/pages/result.html
  功能点：F-30 研究结果页
  上游：../../AGENTS.md（宪法）｜ ../../docs/01-brd/BRD.md（M6-F-30、M4-F-21）
        ../README.md ｜ ../assets/data.js（studies / evidences）
  版式：①~⑦ 用**一整页**表达（单一文档，段落顺序即阅读顺序），不再拆成一要素一张卡；
        仅三处保留自身语义结构——③ 证据与关键发现（整段可折叠，默认收起；单条证据可独立展开回查）
        / ⑤ 支持与不支持并列 / ⑦ 逐项对应表
  验收要点：七要素齐全且顺序为 ① 业务目标与研究问题 / ② 研究范围与方法（条目换行展示）
        / ③ 证据与关键发现 / ④ 人群差异 / ⑤ 候选 HVA 及支持情况 / ⑥ 其他解释与限制（与「已查明」视觉可分）
        / ⑦ 改善方向；候选 HVA 的支持 / 不支持并列展示
  编号：R-xxx 为对外结果编号（页面标题与切换器展示），ST-xxx 为内部研究 ID（仅 URL 参数与技术标识）
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F-30 研究结果</title>
<link rel="stylesheet" href="../assets/base.css">
</head>
<body data-page="result">
<main class="content">

  <div id="root"></div>

  <div class="footer-note">
    功能点 F-30 ｜ 上游 M4-F-21 研究结果生成 ｜ 下游：<a href="followup.html">F-31 追问对话</a>（建新任务并关联原研究）
  </div>

</main>
<script src="../assets/data.js"></script>
<script src="../assets/app.js"></script>
<script>
window.pageInit = function (DB, U) {
  function render(studyId) {
    const s = DB.studies[studyId];
    const o = DB.opportunities.filter(function (x) { return x.id === s.oppId; })[0];
    const supported = s.e5_hva.status === "candidate_supported";

    const findings = s.e3_findings.map(function (f, i) {
      const evs = f.evidences.map(function (eid) {
        const e = DB.evidences[eid];
        if (!e) return "";
        return '<details class="fold" style="margin-top:8px">' +
          "<summary><span class='ev-src'>" + e.sourceName + "</span><span>" + U.esc(e.title) +
          "</span><span class='tag mono'>" + e.id + "</span></summary>" +
          '<div class="fold-body"><div class="field-list">' +
            '<div class="field"><div class="field-label">查询条件</div><div class="field-value">' + U.esc(e.condition) + "</div></div>" +
            '<div class="field"><div class="field-label">信息时点</div><div class="field-value">' + U.esc(e.at) + "</div></div>" +
            '<div class="field"><div class="field-label">适用范围</div><div class="field-value">' + U.esc(e.scope) + "</div></div>" +
            '<div class="field"><div class="field-label">结果</div><div class="field-value">' + U.esc(e.result) + "</div></div>" +
            '<div class="field"><div class="field-label">缺失说明</div><div class="field-value text-2">' + U.esc(e.missing) + "</div></div>" +
          "</div></div></details>";
      }).join("");
      return '<div class="find-item">' +
        '<div style="display:flex;gap:10px;align-items:flex-start">' +
          '<span class="badge ' + (f.support === "supported" ? "badge-done" : "badge-neutral") + '">' + (i + 1) + "</span>" +
          '<div style="flex:1;min-width:0">' +
            '<div class="find-text">' + U.esc(f.text) + "</div>" +
            '<div class="find-limit small text-3" style="margin-top:4px">限制：' + U.esc(f.limit) + "</div>" +
            evs +
          "</div>" +
        "</div></div>";
    }).join("");

    /* 用 ｜ / ； 连接的输入条目拆成多行展示 */
    function lineWrap(str) {
      return (str || "").split(/[｜；]/).map(function (t) { return t.trim(); }).filter(Boolean)
        .map(function (t) { return '<div class="spec-line">' + U.esc(t) + "</div>"; }).join("");
    }
    const goalLines = lineWrap(s.e1_goal);
    const scopeLines = lineWrap(s.e2_scope);

    /* 段落壳：一整页里的一个要素段落 */
    function sec(no, title, note, body, tools) {
      return '<section class="doc-sec">' +
        '<div class="doc-sec-head">' +
          '<div class="doc-sec-title">' + no + " " + title + "</div>" +
          '<div class="card-tools" style="align-items:center;gap:10px">' +
            (note ? '<span class="doc-sec-note">' + note + "</span>" : "") +
            (tools || "") +
          "</div>" +
        "</div>" +
        body +
      "</section>";
    }

    document.getElementById("root").innerHTML =
      '<div class="page-head">' +
        "<div>" +
          '<h1 class="page-title"><span class="fn">F-30</span>研究结果 · ' + s.studyNo + "</h1>" +
          '<p class="page-desc">对应机会 <a href="opportunities.html?id=' + o.id + '">' + o.id + " " + U.esc(o.title) +
          "</a> ｜ 完成于 " + s.finishedAt + "</p>" +
        "</div>" +
        '<div class="page-actions">' +
          '<select id="study-sel" style="width:auto">' +
            Object.keys(DB.studies).map(function (k) {
              const x = DB.studies[k];
              return '<option value="' + k + '"' + (k === studyId ? " selected" : "") + ">" +
                x.studyNo + " · " + x.oppId + "（" +
                (x.e5_hva.status === "candidate_supported" ? "支持候选行为" : "未支持候选行为") + "）</option>";
            }).join("") +
          "</select>" +
          '<a class="btn btn-primary" href="followup.html?study=' + studyId + '">继续追问 →</a>' +
        "</div>" +
      "</div>" +

      '<div class="alert ' + (supported ? "alert-ok" : "alert-info") + '">' +
        '<div class="flex-1"><span class="alert-title">' +
        (supported ? "候选行为获得支持（仍属候选，未定性）" : "未找到足够依据支持候选行为，这也是完整的研究结果") +
        "</span>　" + U.esc(s.e5_hva.name) + "</div>" +
      "</div>" +

      /* 一条文档：①~⑦ 顺序排布，段落间以细线分隔，不再各自成卡 */
      '<div class="card doc">' +

        sec("①", "业务目标与研究问题", "本研究的输入与边界",
          '<div class="doc-body">' + goalLines + "</div>") +

        sec("②", "研究范围与方法", "本研究的输入与边界",
          '<div class="doc-body">' + scopeLines + "</div>") +

        /* ③ 证据与关键发现：整段可折叠（默认收起），段落内单条证据可独立展开 / 收起 */
        sec("③", "证据与关键发现",
          s.e3_findings.length + " 项发现 · 每项挂证据来源与适用范围",
          '<div class="doc-body is-collapsed" id="ev-body"><div id="findings">' + findings + "</div></div>",
          '<button class="btn btn-sm" id="ev-toggle" type="button" aria-label="展开或收起">展开 ▾</button>') +

        sec("④", "人群差异", "", '<div class="doc-body">' + U.esc(s.e4_diff) + "</div>") +

        /* ⑤ 候选 HVA：支持与不支持并列展示 */
        sec("⑤", "候选 HVA 及支持情况", "支持与不支持并列展示",
          '<div class="doc-body">' +
            '<div style="font-size:14px;font-weight:500;margin-bottom:10px">' + U.esc(s.e5_hva.name) + "　" +
              (supported ? '<span class="badge badge-done">支持</span>' : '<span class="badge badge-neutral">不支持</span>') +
            "</div>" +
            '<div class="grid-2">' +
              '<div class="alert alert-ok mb0"><div class="flex-1"><div class="alert-title">支持的方面</div>' +
                "<ul style='padding-left:18px;margin:6px 0 0'>" + s.e5_hva.supported.map(function (x) { return "<li>" + U.esc(x) + "</li>"; }).join("") + "</ul></div></div>" +
              '<div class="alert alert-warn mb0"><div class="flex-1"><div class="alert-title">不支持 / 存疑的方面</div>' +
                "<ul style='padding-left:18px;margin:6px 0 0'>" + s.e5_hva.unsupported.map(function (x) { return "<li>" + U.esc(x) + "</li>"; }).join("") + "</ul></div></div>" +
            "</div>" +
            '<div class="small text-3" style="margin-top:10px">研究完成前一律称「候选行为」，不提前定性为 HVA。</div>' +
          "</div>") +

        /* ⑥ 其他解释与限制：与「已查明」视觉可分 */
        sec("⑥", "其他解释与限制", "与「已查明」视觉可分",
          '<div class="doc-body">' +
            '<div class="doc-limits">' + U.esc(s.e6_limits) + "</div>" +
            '<div class="small text-3" style="margin-top:8px">查询失败导致的未完成<b>不能</b>当作否定结论；运行失败本身不作为否定某项 HVA 的研究依据。</div>' +
          "</div>") +

        /* ⑦ 改善方向：逐项对应发现 */
        sec("⑦", "改善方向", "逐项对应发现：针对什么人群、什么问题、为什么值得改善",
          '<div class="doc-body">' +
            '<table class="tbl tbl-sm"><thead><tr><th style="width:180px">针对</th><th>问题</th><th>为什么值得改善</th></tr></thead><tbody>' +
            s.e7_actions.map(function (a) {
              return "<tr><td>" + U.esc(a.for) + "</td><td>" + U.esc(a.what) + "</td><td class='text-2'>" + U.esc(a.why) + "</td></tr>";
            }).join("") +
            "</tbody></table>" +
            '<div class="small text-3" style="margin-top:10px">' + U.esc(s.outOfScopeNote) + "</div>" +
          "</div>") +

      "</div>";

    document.getElementById("study-sel").addEventListener("change", function (e) { render(e.target.value); });

    /* ---------- ③ 证据与关键发现：整段折叠（不影响段内单条证据的展开 / 收起） ---------- */
    const evBody = document.getElementById("ev-body");
    const evToggle = document.getElementById("ev-toggle");
    evToggle.addEventListener("click", function () {
      const collapsed = evBody.classList.toggle("is-collapsed");
      evToggle.textContent = collapsed ? "展开 ▾" : "收起 ▴";
    });
  }

  render(U.qs("study") || "ST-007");
};
</script>
</body>
</html>
<!--
  反向清单：
  - 被 ../README.md 登记
  - 被 ../index.html 链接（默认 ST-007）
  - 被 opportunities.html 链接（列表右栏「查看研究结果」）
  - 下游：followup.html（F-31）
  - 版式依赖：../assets/base.css 的 .doc-sec / .doc-sec-title / .doc-body / .doc-limits / .find-item
-->
