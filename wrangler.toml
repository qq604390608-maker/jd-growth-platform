# 文档卡（阶段0-工程骨架 · 2026-09-19）
# 上游：AGENTS.md（宪法索引：server/ 五模块名不得改）｜ docs/03-locks/tech-stack.md（§2.2 服务端模块 / §6 工程结构 / §7.3 部署形态 TS-20 待确认）｜ docs/04-plan/dev-plan.md（阶段0 验收要点：wrangler dev 起本地 D1 + 迁移 apply 成功）｜ db/（迁移脚本 ./db/migrations、种子 ./db/seed）
# 职责：Wrangler 部署配置。本文件为工程骨架最小可用版——单 Worker 入口 + D1 绑定，不含任何业务逻辑与密钥。
# 硬红线落实（tech-stack §7.2 / BRD §5.3）：本配置不写入任何 CLOUDFLARE_API_TOKEN / 外部系统凭证；本地 dev 不需要 account_id，生产部署由 CI Secrets 注入。
# 反向清单：被 AGENTS.md 索引 server/ 行引用；被 server/ 各模块（后续）与阶段0-CI（.github/workflows）复用。
# TS-20 已落地（2026-09-21）：本文件为 **api Worker**（jd-growth-platform）；第二个 Worker（runner）见
# `wrangler.runner.toml`（main = server/task-runner/index.js，CI deploy 第二步 `deploy -c` 部署）。
# TS-15 已落地（2026-09-21，依用户裁决「长期同源」＋本次确认「现在就挂」）：前端运营工作台
# （frontend/，F-27~F-32 六页，读真库）以 Workers Static Assets **同源同 Worker 托管**——
# 命中静态文件由平台直接服务（`/` → index.html），未命中路径（/api/* 等）照常进 Worker 脚本。
# 前端唯一网络出口 frontend/assets/api.js 只发 `/api/` 同源相对路径，与同源部署互为前提。

name = "jd-growth-platform"
main = "server/api/index.js"
compatibility_date = "2026-09-19"

# 前端静态资产（TS-15 同源；宪法红线：原型的 mock 数据不复制进前端，页面动态数据全经 /api/）
[assets]
directory = "./frontend"

# D1 数据库绑定（tech-stack §2.3 / §3；外键强制已本地+远程双实测，见 db/probes/fk/）
# 本地：wrangler dev / wrangler d1 migrations apply --local 自动建本地库
# 远程：2026-09-21 已实建（id 见下；无生产数据前由本机实跑探针，门禁 B 后由 CI 接管迁移）
[[d1_databases]]
binding = "DB"
database_name = "jd-growth-platform"
database_id = "853be8d3-bca2-4683-ab7a-a61725516662"
migrations_dir = "./db/migrations"

# Workers AI 绑定（tech-stack §2.5 DS-02；A-1 LLM 推理服务）
# ⚠️ 生产必须保留此段（勿注释）：ci.yml 的部署步是 `wrangler deploy` **原样使用本文件**，
#    不存在「CI 追加 binding」机制，也无 wrangler.prod.toml——注释掉 [ai] 会导致
#    生产 env.AI = undefined（A-1 门禁会响亮抛错，不会静默降级，见 discovery.js）。
# 语法：单表 [ai]（Workers AI 是单一绑定；官方 docs `workers-ai/configuration/bindings`
#    示例即 [ai]，与可多实例的 [[d1_databases]] 不同类；2026-09-20 曾误改 [[ai]]，查证后订正）。
# 本地 dev 两种跑法（均勿提交对[ai]的临时注释，git 内始终保持生效）：
#    a) 带 CLOUDFLARE_API_TOKEN：AI binding 走 remote（官方文档明示本地亦计费）；
#    b) 零密钥临时注释 [ai] 后：编排调用须显式传 opts.mock = true（输出带 _mock 标记、
#       零写库、模型名 mock-model，/api/health 会如实上报 ai: "mock_mode"）。
[ai]
binding = "AI"
