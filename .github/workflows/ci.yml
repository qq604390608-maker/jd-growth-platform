# 文档卡（阶段0-CI · 2026-09-19）
# 上游：AGENTS.md（宪法：硬红线零写 / 凭证不落库）｜ docs/04-plan/dev-plan.md（L70 CI 任务书 / L158 CI/CD 纪律：每 F-xx 一 PR、wrangler deploy + d1 migrations apply、凭证仅经 Secrets）｜ docs/03-locks/tech-stack.md（§1.3 部署形态 / §7.2 凭证落实）｜ wrangler.toml（Worker 名 jd-growth-platform / D1 绑定 DB）
# 职责：GitHub Actions 流水线——PR 校验（标题白盒命名 + D1 迁移可应用 + 入口静态检查 + mock 自检 + F-01/F-02/F-03/F-04/F-05/F-06/F-07/F-08/F-09/F-10/F-11/F-12/F-13/F-14/F-15/F-16/F-17/F-18/F-19/F-20/F-21/F-22/F-23/F-24/F-25/F-26/F-27/F-28/F-29/F-30/F-31 用例 + 引用自检「孤儿/悬空/重号 0 命中」与其骨架）+ 主干部署（D1 迁移 apply + wrangler deploy）。
# 硬红线落实：CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 仅经 GitHub Secrets 注入，绝不写入本文件或仓库；流水线本身不直连任何生产写接口，部署的"写"由 Cloudflare 平台侧凭据授权，符合 BRD §5.3。
# 反向清单：被 AGENTS.md 索引 .github/ 行引用；被 server/ 各模块（阶段1~5 部署）与 dev-plan §3 阶段0 验收要点复用。
# 注：分支保护（main 需 PR 审核 + 状态检查通过）为仓库设置项，不在本文件内，须在 GitHub 仓库 Settings → Branches 手动开启（见 .github/README.md）。

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 校验 PR 标题符合白盒命名（F-xx / 阶段N / chore / docs / ci）
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "PR title: $TITLE"
          if echo "$TITLE" | grep -Eq '^(F-[0-9]{2}(-[A-Za-z0-9]+)*|阶段[0-9]|chore|docs|ci)([:(].+)?.*'; then
            echo "OK: 标题符合白盒命名约定（每 F-xx 一个 PR，见 dev-plan §3 L158）"
          else
            echo "FAIL: PR 标题须以 F-xx / 阶段N / chore / docs / ci 开头"
            exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 校验 D1 迁移可在本地应用（真实执行，FK 强制）
        run: npx wrangler@4.135.0 d1 migrations apply jd-growth-platform --local --yes
      - name: 静态检查 Worker 入口
        run: node --check server/api/index.js
      - name: 跑 mock server 自检（demo 值不进断言）
        run: node prototype/mock/verify.js
      - name: 跑 F-07 用例（M2 共享上下文，node:sqlite 载入真实 DDL 跑约束）
        run: node server/shared-context/test-f07.mjs
      - name: 跑 F-08 用例（M2 来源登记，载入真实 DDL + 种子跑 CFG-01 约束与缺口语义）
        run: node server/shared-context/test-f08.mjs
      - name: 跑 F-09 用例（M2 证据管理，跑 EXT-02 外键 + 证据四要素 + 回查链路 + 新旧依据并存不覆盖）
        run: node server/shared-context/test-f09.mjs
      - name: 跑 F-10 用例（M2 机会记录，跑 MD-06 六要素 NOT NULL+CHECK + unknown_item 二态 + LNK-01/LNK-03 复合 UK + 自环 + 状态链）
        run: node server/shared-context/test-f10.mjs
      - name: 跑 F-11 用例（M2 研究结果与历史，跑 MD-07/EXT-03 外键 + 追问不覆盖 + parent_research_no 追问链追溯 + MD-08 只读与复合 UK）
        run: node server/shared-context/test-f11.mjs
      - name: 跑 F-12 用例（M2 上下文按任务注入，跑 CFG-06 复合 UK + PD-06 task_id 外键 + 类型/范围两维度装配 + 注入确定性可复现与幂等 + Q-08 三类不落行）
        run: node server/shared-context/test-f12.mjs
      - name: 跑 F-23 用例（M5 工具注册与权限，跑 CFG-02 PK/UK/FK + CFG-03 tool_id FK + CFG-04 goal_id 可空 + CFG-05 PK + 权限分支互斥与受限原因 + 生产零写）
        run: node server/tool-executor/test-f23.mjs
      - name: 跑 F-24 用例（M5 真实查询返回，跑 DS-06 五协议面 + 权限分支互斥 + data 逐字节原样 + 九类行为映射 EXT-01 + 实体级隔离 + 传输层零 SQL 零写）
        run: node server/tool-executor/test-f24.mjs
      - name: 跑 F-25 用例（M5 查询记录保存，跑 EXT-01 task_id/source_id FK + 每次执行落一行 + 失败/受限/执行中/超时四类均留痕 + 留痕不变量 6 条 + 回查与四要素派生 + 生产零写）
        run: node server/tool-executor/test-f25.mjs
      - name: 跑 F-26 用例（M5 失败重试与受限返回，跑 CFG-04 retry_limit 上限口径（封顶 100）+ 重试是代码逻辑 + 成功不算失败 + 用尽→blocked/再犯→stopped + 停止不自动重启 + 受限不重试 + 写入面静态验证 + 失败不否定结论）
        run: node server/tool-executor/test-f26.mjs
      - name: 跑 F-01 用例（M1 目标登记与口径管理，跑 MD-01/02 版本化与 is_applied 至多一行 1 + 历史快照逐字节只读 + CFG-05 规则驱动口径检查 → PD-04 待补项 + 别名归一与值域合法 + 补充并入六要素 bump 新版本 + goal_check 2 步任务 + 写入面静态验证）
        run: node server/task-runner/test-f01.mjs
      - name: 跑 F-02 用例（M1 机会发现任务调度，跑运行频率四式解析为 Cron + 最小粒度 1 分钟 + 250 条上限 + retry_limit/max_duration_min 写入侧从严 + 策略目标级优先回落平台级 + Queue 消息恰两键且 <1KB + 发现任务五步与 CFG-06 上下文现读 + Agent 只在任务内被调用 + PD-02 复合 UK）
        run: node server/task-runner/test-f02.mjs
      - name: 跑 F-03 用例（M1 研究建议管理·人工节点，跑 MD-12 建议登记与研究问题必需 + 可选列 varchar(300) 拒超长 + 幂等键确定性与分隔符歧义反例 + 建议与机会版本绑定（版本号从机会现读）+ 重复提交幂等（不新建行、不重复启动）+ 机会状态迁移留 PD-05 + PD-05 外键 L3 反例 + 触发登记守卫）
        run: node server/task-runner/test-f03.mjs
      - name: 跑 F-04 用例（M1 HVA 研究任务调度，跑第二阶段启动时点＝建议提交 + 五步逐字对齐原型 + LNK-04 proposal 触发/opportunity 作用对象 + 二阶段上下文按 CFG-06 hva_research 模板落 PD-06（含 selected_opp 关联机会 / product_question 关联建议）+ CFG-03 按 hva-agent 取工具权限 + 版本冲突以机会为准并提示（不阻断）+ 重复启动同一建议报错 + Queue 消息恰两键 + Agent 只在任务内被调用 + 零外部调用）
        run: node server/task-runner/test-f04.mjs
      - name: 跑 F-05 用例（M1 追问与版本管理，跑关联原研究建 hva_followup 任务（parent_task_id 挂原任务）+ 新 MD-07 研究壳（parent_research_no 指原研究 / start_task_id 指新任务 / 七要素从原研究承接）+ LNK-04 锚点 + 五步逐字对齐原型 + 二阶段上下文按 CFG-06 hva_followup 模板落 PD-06（含 related_history）+ CFG-03 按 hva-agent 取工具权限 + PD-07 追问消息双外键库级强制（TC-D-M1-008）+ 原研究/原任务维持启动版本不变（可显式升版不混旧）+ 编号推进 + 静态核验零外部调用）
        run: node server/task-runner/test-f05.mjs
      - name: 跑 F-06 用例（M1 任务记录与异常恢复，跑任务态复用 F-26 task-state.js 写入面（只写 PD-01/PD-03）+ 受阻矩阵映射（保留 done_part + blocked + 写 PD-03）+ retry_limit 封顶 100 显式报错（TC-U-M1-002）+ stopped 不自动重启（前置守卫拒写）+ resume blocked→running + done 不可改写 + 失败不否定 HVA（静态零 MD-07/EXT-02 写入）+ 零外部调用）
        run: node server/task-runner/test-f06.mjs
      - name: 跑 F-13 用例（M3 角色指令配置·agent-orchestrator，跑 MD-13 agent_profile 读 + agent.md 版本推进（单行 UNIQUE、不新建行）+ MD-14 skill_registry 注册（PK/UK/FK 库级强制）+ 生效 Skills 列表 + 版本快照组装 + 静态核验零外部调用 / 唯一写入面 MD-13+MD-14）
        run: node server/agent-orchestrator/test-f13.mjs
      - name: 跑 F-14 用例（M3 围绕目标寻找线索·agent-orchestrator，跑意向分归一 min(raw/threshold,1) 封顶（TC-U-M3-001）+ S-A1 一阶段注入清单→确定性查证计划＋停止条件（TC-A-M3-001）+ S-A3 线索须有人群/旅程归属、拒裸变化（TC-A-M3-003）+ loadDiscoveryContext 复用 shared-context 读面零写 + 静态零外部调用 / 零裸 SQL）
        run: node server/agent-orchestrator/test-f14.mjs
      - name: 跑 F-15 用例（M3 基础查证·agent-orchestrator，跑 S-A2 经 M5 真实查询透传＋硬红线「禁止以模型预期代替查询结果」（哨兵串证明，TC-A-M3-002 / TC-I-M3-002）+ 五项检查五路齐备与缺口标注（来源/适用范围/信息时点/已有机会/信息缺口，缺口口径读 CFG-05）+ 倒挂隔离仅该条失效非整包失败（TC-A-M3-006）+ 缺字段退回请补不编造（TC-A-M3-005）+ 证据草稿四要素与复用 F-09 落 EXT-02 回查 + 一步编排成败两路 + 静态零外部调用 / 零写语句 / 外部访问只经 M5）
        run: node server/agent-orchestrator/test-f15.mjs
      - name: 跑 F-16 用例（M3 机会形成与去重·agent-orchestrator，跑 S-A4 整理：依据足够→组装六要素（对应目标/涉及对象/观察现象/初步依据/研究理由＋未知项二态）落 MD-06＋判重命中落 LNK-03 相同问题关联更新（方向对齐种子 LK-OR-002）（TC-A-M3-004）+ 依据不足→缺口记录（检查范围＋信息缺口＋影响判断）且不写任何表（合法产出）+ ADR-003 二态（未评估→不齐 / 确无→齐全 / 纯空白串应用层显式拒）+ 依据足够性判据（真实返回/来源可回查/未倒挂/六要素已评估齐备/标题可派生，适用范围未判定不阻断）+ 取号推进 + 静态零外部调用 / 零自有写语句 / 零裸 SQL / 唯一依赖 shared-context）
        run: node server/agent-orchestrator/test-f16.mjs
      - name: 跑 F-17 用例（M3 两步衔接·agent-orchestrator，跑 M3 产出→PM 决策上下文（机会六要素＋初步依据四要素（来源/条件/时点/适用范围）＋未知项＋缺口＋「尚不构成 HVA 结论」声明）+ 人工节点守卫（完成判据＝MD-12 有无真实建议行——不看 opportunity_status 防状态假通过；auto_handoff 恒 false；TC-I-M3-001）+ 经 F-03 submitProposal 完成人工节点后放行（仍不自动、仍不建 M4 任务）+ 反向问 PM 请补项 + 交接包只组装不触发（task/hva_research 行数不变）+ 机会不存在报错 + 常量口径 + 静态零外部调用 / 零写库 / 零裸 SQL / 不 import hva.js / 不出现 M4 建任务函数名）
        run: node server/agent-orchestrator/test-f17.mjs
      - name: 跑 F-18 用例（M4 角色指令配置·agent-orchestrator，跑 装载运行期角色指令包（复用 F-13 读面读 MD-13/MD-14：agent.md 段落骨架 5 段 + business-rules 8 条 + 生效 Skill + 版本快照；叙述文本本体在 agent-runtime/，服务端只持编号与判据键）+ 本体逐条对齐（business-rules.md 有序列表 8 条标题 / hva/agent.md 五段章节，本体已去建壳声明）+ 结束条件二选一（有依据的研究回答 / 说明无法完成判断的原因＝合法结束；无依据不构成研究回答、产品假设不得当回答、失败导致的否定不得作否定依据——BRD §7 第 4 条）+ 产品假设性质标注（不预设结论）+ 输出边界扫描（禁活动配置/权益组合/预算/排期——TC-C-M4-001 硬红线的可运行形式）+ 运行期零写（真库行数不变 + fake-db 全 SELECT）+ 静态零外部调用 / 零写语句 / 零裸 SQL / 仅依赖 F-13 读面）
        run: node server/agent-orchestrator/test-f18.mjs
      - name: 跑 F-19 用例（M4 研究起点处理·agent-orchestrator，跑 S-B1 二阶段注入清单→三分支路径选择（① 有假设→查证假设、② 只有研究问题→寻找候选、③ 问题不适合→说明限制）＋路径确定即停止（TC-A-M4-001）+ 产品假设不预先作为结论（复用 F-18 labelProductHypothesis 单一口径）+ 允许找不到有足够依据的候选行为＝完整结果 + 适合性判断可注入、A-1 门禁下走确定性 fallback 不硬造「不适合」（TC-I-M4-003）+ 比较条件三项「能定则定、缺则如实登记」+ 查证顺序＝五查顺序 + 薄读注入清单（F-03 建议 + F-04 任务链真实夹具：机会及版本/产品问题/可选假设/证据/历史）+ MD-12 opportunity_id 外键反例（TC-D-M4-006）+ 运行期零写（真库行数不变 + fake-db 全 SELECT）+ 静态零外部调用 / 零写语句 / 零裸 SQL / 复用 F-18 口径与 shared-context 读面）
        run: node server/agent-orchestrator/test-f19.mjs
      - name: 跑 F-20 用例（M4 人群比较与行为关系检验·agent-orchestrator，跑 综合分入池阈值（TC-U-M4-001：0.62/0.6 入池、0.55/0.6 不入池，确定性无随机）+ S-B2 人群可比性（TC-A-M4-002：差异是否已解释→结论＋限制，差异未解释/无法明确时限制行为作用判断）+ S-B3 候选行为五查（TC-A-M4-003：① 人群可比基础 ② 先后关系 ③ 口径一致 ④ 其他解释 ⑤ 信息充分；倒挂隔离＝信息时点晚于取数时刻的仅该条失效、非整包失败；活动存在 ≠ 用户参与、未排查维度不默认无关；因果不臆断；失败导致的条目不作否定依据而转缺口；未支持亦为完整结果）+ 缺比较条件退回请补（TC-A-M4-006：draft=null，不静默回退）+ 落库 MD-09/MD-10（失败与倒挂条目不下沉、只新增这两表行、状态推进只改状态列）+ MD-09 外键反例（TC-D-M4-003）+ MD-10 复合 UK 反例（TC-D-M4-004）+ 经 M5 只读查询与运行期零写（TC-I-M4-002）+ 静态零外部调用 / 零写语句 / 零裸 SQL / 口径全复用 F-15 与 F-19）
        run: node server/agent-orchestrator/test-f20.mjs
      - name: 跑 F-21 用例（M4 研究结果生成·agent-orchestrator，跑 S-B4 七要素组装契约（业务目标与研究问题/研究范围与方法/证据与关键发现/人群差异/候选HVA及支持情况/其他解释与限制/改善方向，对齐 TC-C-M4-001）+ 逐发现挂证据（LNK-02 写入归 F-11）+ 支持与不支持并列 + 缺证据记缺口 + due_to_failure 发现不进「证据与关键发现」+ 未找到有足够依据支持候选 HVA 亦成完整结果（TC-A-M4-004）+ 失败不否定（TC-A-M4-005）+ 输出边界扫描（活动配置/权益组合/预算/排期禁词，out_of_scope_note 豁免；复用 F-18 禁词表）+ 改善方向逐项对应发现（对不上记 orphan/malformed）+ 落库五路前置守卫（边界/对应性/齐备/研究存在/已出报告）+ MD-07 FK 反例（TC-D-M4-001）/ MD-08 复合 UK 反例（TC-D-M4-002）/ MD-11 UK 反例（TC-D-M4-005）+ 运行期零写（真库行数不变 + fake-db 全 SELECT）+ 静态零外部调用 / 零 SQL 语句 / 口径全复用 F-11 与 F-18/F-20）
        run: node server/agent-orchestrator/test-f21.mjs
      - name: 跑 F-22 用例（M4 继续追问承接·agent-orchestrator，跑 承接已有研究上的新问题→检查既有依据是否仍适用（TC-I-M4-001：时间范围/查询条件/适用范围三维度→沿用 or 补查三态判定；未声明变更→undetermined＋llm_gated 不硬猜；更窄适用范围沿用、更宽/未声明/无法解析一律保守补查）+ 版本口径（追问可落新版本、原任务与原研究钉在启动版本；范围变更未升版提示 new_version_required，建版本行归 M1 F-01）+ 新一轮入口 S-B1（链 F-19>F-20>F-21、五查键派生自 F-19、比较条件复用 F-19）+ 保留原结果与依据（original_preserved 前后快照逐字节自检、negates_original_conclusion 恒 false）+ 追问越界只提示不拦截 + 下游派发可注入（未注入不触发）+ 入口守卫五路 + 运行期零写（7 张表行数 + research/task/research_finding 逐行不变）+ 静态零外部调用 / 零写语句 / 零 SELECT / import 恰 6 条全为既有读面 / 不重复实现上游写面）
        run: node server/agent-orchestrator/test-f22.mjs
      - name: 安装前端用例依赖（jsdom；仓库零构建、无 package.json，仅测试期依赖，--no-save 不落清单）
        run: npm i --no-save --no-audit --no-fund jsdom
      - name: 跑 F-27 用例（M6 目标配置页，jsdom 载真实页面 + 真实 Worker + 真实 D1（node:sqlite 载真实 DDL/种子），跑 TC-I-M6-001 六要素登记与新版本＋影响范围 + TC-C-M6-001 动态数据只经 server/api + TC-D-M6-001 前端不写库（SQL 语句形态静态扫描 + 运行期写请求全部经 /api/ 转发）+ TC-I-M6-007 前后端分离判断标准（前端不携带数据快照、直接调接口仍 200））
        run: node frontend/test-f27.mjs
      - name: 跑 F-28 用例（M6 机会列表与详情页，jsdom 载真实页面 + 真实 Worker + 真实 D1（node:sqlite 载真实 DDL/种子），跑 TC-I-M6-002 按目标浏览机会三状态＋详情六要素＋未知项二态＋证据链点开回查（含「四要素不齐不可作为有效依据」反例）+ TC-C-M6-001 动态数据只经 server/api + TC-D-M6-001 前端不写库（SQL 语句形态静态扫描 + 运行期写请求只落 /api/opportunity-status）+ TC-I-M6-007 前后端分离判断标准（直接调接口仍 200））
        run: node frontend/test-f28.mjs
      - name: 跑 F-29 用例（M6 研究建议提交页，jsdom 载真实页面 + 真实 Worker + 真实 D1（node:sqlite 载真实 DDL/种子），跑 TC-I-M6-003 选机会＋研究问题必需＋边填边看的即时检查（规则只在服务端 /api/research-proposal-checks，含「不误报」反例）＋提交落 MD-12 并触发 F-04（第二阶段启动时点＝建议提交时刻 / PD-06 二阶段上下文 / LNK-04 关联）＋重复提交幂等（建议行与任务行均不变、且不再调 F-04）＋「是否已提交过」以 MD-12 事实行为准（含机会状态与事实不符的反例）+ TC-C-M6-001 动态数据只经 server/api + TC-D-M6-001 前端不写库（SQL 语句形态静态扫描 + 运行期写请求只落本点三个既有路由）+ TC-I-M6-007 前后端分离判断标准（直接调接口仍可用））
        run: node frontend/test-f29.mjs
      - name: 跑 F-30 用例（M6 研究结果页，jsdom 载真实页面 + 真实 Worker + 真实 D1（node:sqlite 载真实 DDL/种子），跑 TC-I-M6-004 呈现结果七要素＋逐发现挂证据来源与适用范围＋候选 HVA 支持/不支持并列＋已查明与仍受限视觉可分 + TC-C-M6-001 动态数据只经 server/api + TC-D-M6-001 前端不写库（SQL 语句形态静态扫描 + 运行期零写请求）+ TC-I-M6-007 前后端分离判断标准（直接调接口仍 200））
        run: node frontend/test-f30.mjs
      - name: 跑 F-31 用例（M6 追问对话页，jsdom 载真实页面 + 真实 Worker + 真实 D1（node:sqlite 载真实 DDL/种子），跑 TC-I-M6-005 场景化追问＋建新任务关联原研究（F-05）＋已注入上下文呈现＋可调度工具（来源授权/降级徽标，真实字段）+ TC-C-M6-001 动态数据只经 server/api + TC-D-M6-001 前端不写库（SQL 语句形态静态扫描 + 运行期写请求只落 /api/followup-tasks）+ TC-I-M6-007 前后端分离判断标准（直接调接口仍 200））
        run: node frontend/test-f31.mjs
      - name: 跑引用自检骨架（scripts/tests，夹具断言：三类能抓到 / 干净能放行 / 豁免与 strict 生效）
        run: node scripts/tests/test-ref-check.mjs
      - name: 跑引用自检（孤儿 / 悬空 / 重号 0 命中）
        run: node scripts/ref-check.mjs

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 应用 D1 迁移到远程库
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.135.0 d1 migrations apply jd-growth-platform --remote --yes
      - name: 部署 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.135.0 deploy
