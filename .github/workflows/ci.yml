# 文档卡（阶段0-CI · 2026-09-19）
# 上游：AGENTS.md（宪法：硬红线零写 / 凭证不落库）｜ docs/04-plan/dev-plan.md（L70 CI 任务书 / L158 CI/CD 纪律：每 F-xx 一 PR、wrangler deploy + d1 migrations apply、凭证仅经 Secrets）｜ docs/03-locks/tech-stack.md（§1.3 部署形态 / §7.2 凭证落实）｜ wrangler.toml（Worker 名 jd-growth-platform / D1 绑定 DB）
# 职责：GitHub Actions 流水线——PR 校验（标题白盒命名 + D1 迁移可应用 + 入口静态检查 + mock 自检 + F-07/F-08/F-09/F-10/F-11 用例）+ 主干部署（D1 迁移 apply + wrangler deploy）。
# 硬红线落实：CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 仅经 GitHub Secrets 注入，绝不写入本文件或仓库；流水线本身不直连任何生产写接口，部署的"写"由 Cloudflare 平台侧凭据授权，符合 BRD §5.3。
# 反向清单：被 AGENTS.md 索引 .github/ 行引用；被 server/ 各模块（阶段1~5 部署）与 dev-plan §3 阶段0 验收要点复用。
# 注：分支保护（main 需 PR 审核 + 状态检查通过）为仓库设置项，不在本文件内，须在 GitHub 仓库 Settings → Branches 手动开启（见 .github/README.md）。

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 校验 PR 标题符合白盒命名（F-xx / 阶段N / chore / docs / ci）
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "PR title: $TITLE"
          if echo "$TITLE" | grep -Eq '^(F-[0-9]{2}(-[A-Za-z0-9]+)*|阶段[0-9]|chore|docs|ci)([:(].+)?.*'; then
            echo "OK: 标题符合白盒命名约定（每 F-xx 一个 PR，见 dev-plan §3 L158）"
          else
            echo "FAIL: PR 标题须以 F-xx / 阶段N / chore / docs / ci 开头"
            exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 校验 D1 迁移可在本地应用（真实执行，FK 强制）
        run: npx wrangler@4.135.0 d1 migrations apply jd-growth-platform --local --yes
      - name: 静态检查 Worker 入口
        run: node --check server/api/index.js
      - name: 跑 mock server 自检（demo 值不进断言）
        run: node prototype/mock/verify.js
      - name: 跑 F-07 用例（M2 共享上下文，node:sqlite 载入真实 DDL 跑约束）
        run: node server/shared-context/test-f07.mjs
      - name: 跑 F-08 用例（M2 来源登记，载入真实 DDL + 种子跑 CFG-01 约束与缺口语义）
        run: node server/shared-context/test-f08.mjs
      - name: 跑 F-09 用例（M2 证据管理，跑 EXT-02 外键 + 证据四要素 + 回查链路 + 新旧依据并存不覆盖）
        run: node server/shared-context/test-f09.mjs
      - name: 跑 F-10 用例（M2 机会记录，跑 MD-06 六要素 NOT NULL+CHECK + unknown_item 二态 + LNK-01/LNK-03 复合 UK + 自环 + 状态链）
        run: node server/shared-context/test-f10.mjs
      - name: 跑 F-11 用例（M2 研究结果与历史，跑 MD-07/EXT-03 外键 + 追问不覆盖 + parent_research_no 追问链追溯 + MD-08 只读与复合 UK）
        run: node server/shared-context/test-f11.mjs

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 应用 D1 迁移到远程库
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.135.0 d1 migrations apply jd-growth-platform --remote --yes
      - name: 部署 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.135.0 deploy
