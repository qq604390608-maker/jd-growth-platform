# 文档卡（阶段0-CI · 2026-09-19）
# 上游：AGENTS.md（宪法：硬红线零写 / 凭证不落库）｜ docs/04-plan/dev-plan.md（L70 CI 任务书 / L158 CI/CD 纪律：每 F-xx 一 PR、wrangler deploy + d1 migrations apply、凭证仅经 Secrets）｜ docs/03-locks/tech-stack.md（§1.3 部署形态 / §7.2 凭证落实）｜ wrangler.toml（Worker 名 jd-growth-platform / D1 绑定 DB）
# 职责：GitHub Actions 流水线——PR 校验（标题白盒命名 + D1 迁移可应用 + 入口静态检查 + mock 自检 + F-01/F-07/F-08/F-09/F-10/F-11/F-12/F-23/F-24/F-25/F-26 用例 + 引用自检「孤儿/悬空/重号 0 命中」与其骨架）+ 主干部署（D1 迁移 apply + wrangler deploy）。
# 硬红线落实：CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 仅经 GitHub Secrets 注入，绝不写入本文件或仓库；流水线本身不直连任何生产写接口，部署的"写"由 Cloudflare 平台侧凭据授权，符合 BRD §5.3。
# 反向清单：被 AGENTS.md 索引 .github/ 行引用；被 server/ 各模块（阶段1~5 部署）与 dev-plan §3 阶段0 验收要点复用。
# 注：分支保护（main 需 PR 审核 + 状态检查通过）为仓库设置项，不在本文件内，须在 GitHub 仓库 Settings → Branches 手动开启（见 .github/README.md）。

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 校验 PR 标题符合白盒命名（F-xx / 阶段N / chore / docs / ci）
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "PR title: $TITLE"
          if echo "$TITLE" | grep -Eq '^(F-[0-9]{2}(-[A-Za-z0-9]+)*|阶段[0-9]|chore|docs|ci)([:(].+)?.*'; then
            echo "OK: 标题符合白盒命名约定（每 F-xx 一个 PR，见 dev-plan §3 L158）"
          else
            echo "FAIL: PR 标题须以 F-xx / 阶段N / chore / docs / ci 开头"
            exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 校验 D1 迁移可在本地应用（真实执行，FK 强制）
        run: npx wrangler@4.135.0 d1 migrations apply jd-growth-platform --local --yes
      - name: 静态检查 Worker 入口
        run: node --check server/api/index.js
      - name: 跑 mock server 自检（demo 值不进断言）
        run: node prototype/mock/verify.js
      - name: 跑 F-07 用例（M2 共享上下文，node:sqlite 载入真实 DDL 跑约束）
        run: node server/shared-context/test-f07.mjs
      - name: 跑 F-08 用例（M2 来源登记，载入真实 DDL + 种子跑 CFG-01 约束与缺口语义）
        run: node server/shared-context/test-f08.mjs
      - name: 跑 F-09 用例（M2 证据管理，跑 EXT-02 外键 + 证据四要素 + 回查链路 + 新旧依据并存不覆盖）
        run: node server/shared-context/test-f09.mjs
      - name: 跑 F-10 用例（M2 机会记录，跑 MD-06 六要素 NOT NULL+CHECK + unknown_item 二态 + LNK-01/LNK-03 复合 UK + 自环 + 状态链）
        run: node server/shared-context/test-f10.mjs
      - name: 跑 F-11 用例（M2 研究结果与历史，跑 MD-07/EXT-03 外键 + 追问不覆盖 + parent_research_no 追问链追溯 + MD-08 只读与复合 UK）
        run: node server/shared-context/test-f11.mjs
      - name: 跑 F-12 用例（M2 上下文按任务注入，跑 CFG-06 复合 UK + PD-06 task_id 外键 + 类型/范围两维度装配 + 注入确定性可复现与幂等 + Q-08 三类不落行）
        run: node server/shared-context/test-f12.mjs
      - name: 跑 F-23 用例（M5 工具注册与权限，跑 CFG-02 PK/UK/FK + CFG-03 tool_id FK + CFG-04 goal_id 可空 + CFG-05 PK + 权限分支互斥与受限原因 + 生产零写）
        run: node server/tool-executor/test-f23.mjs
      - name: 跑 F-24 用例（M5 真实查询返回，跑 DS-06 五协议面 + 权限分支互斥 + data 逐字节原样 + 九类行为映射 EXT-01 + 实体级隔离 + 传输层零 SQL 零写）
        run: node server/tool-executor/test-f24.mjs
      - name: 跑 F-25 用例（M5 查询记录保存，跑 EXT-01 task_id/source_id FK + 每次执行落一行 + 失败/受限/执行中/超时四类均留痕 + 留痕不变量 6 条 + 回查与四要素派生 + 生产零写）
        run: node server/tool-executor/test-f25.mjs
      - name: 跑 F-26 用例（M5 失败重试与受限返回，跑 CFG-04 retry_limit 上限口径（封顶 100）+ 重试是代码逻辑 + 成功不算失败 + 用尽→blocked/再犯→stopped + 停止不自动重启 + 受限不重试 + 写入面静态验证 + 失败不否定结论）
        run: node server/tool-executor/test-f26.mjs
      - name: 跑 F-01 用例（M1 目标登记与口径管理，跑 MD-01/02 版本化与 is_applied 至多一行 1 + 历史快照逐字节只读 + CFG-05 规则驱动口径检查 → PD-04 待补项 + 别名归一与值域合法 + 补充并入六要素 bump 新版本 + goal_check 2 步任务 + 写入面静态验证）
        run: node server/task-runner/test-f01.mjs
      - name: 跑引用自检骨架（scripts/tests，夹具断言：三类能抓到 / 干净能放行 / 豁免与 strict 生效）
        run: node scripts/tests/test-ref-check.mjs
      - name: 跑引用自检（孤儿 / 悬空 / 重号 0 命中）
        run: node scripts/ref-check.mjs

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 应用 D1 迁移到远程库
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.135.0 d1 migrations apply jd-growth-platform --remote --yes
      - name: 部署 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.135.0 deploy
